<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Client Application Layer -->
    <rect x="300" y="20" width="200" height="60" rx="5" fill="#e6e6fa" stroke="#000"/>
    <text x="400" y="55" text-anchor="middle">Data Collection Interface (PyQt5)</text>
    
    <!-- Arduino Layer -->
    <rect x="300" y="120" width="200" height="60" rx="5" fill="#e6e6fa" stroke="#000"/>
    <text x="400" y="155" text-anchor="middle">Arduino Mega</text>
    
    <!-- Hardware Layer -->
    <g transform="translate(100,240)">
        <rect width="120" height="60" rx="5" fill="#e6e6fa" stroke="#000"/>
        <text x="60" y="35" text-anchor="middle">Doppler Sensor 1</text>
    </g>
    <g transform="translate(260,240)">
        <rect width="120" height="60" rx="5" fill="#e6e6fa" stroke="#000"/>
        <text x="60" y="35" text-anchor="middle">Doppler Sensor 2</text>
    </g>
    <g transform="translate(420,240)">
        <rect width="120" height="60" rx="5" fill="#e6e6fa" stroke="#000"/>
        <text x="60" y="35" text-anchor="middle">Doppler Sensor 3</text>
    </g>
    <g transform="translate(580,240)">
        <rect width="120" height="60" rx="5" fill="#e6e6fa" stroke="#000"/>
        <text x="60" y="35" text-anchor="middle">Doppler Sensor 4</text>
    </g>
    
    <!-- Processing Layer -->
    <rect x="100" y="360" width="600" height="60" rx="5" fill="#e6e6fa" stroke="#000"/>
    <text x="400" y="395" text-anchor="middle">Signal Processing (STFT, Spectogram Generation)</text>
    
    <!-- ML Layer -->
    <g transform="translate(100,460)">
        <rect width="180" height="60" rx="5" fill="#e6e6fa" stroke="#000"/>
        <text x="90" y="35" text-anchor="middle">Traditional ML Models</text>
    </g>
    <g transform="translate(310,460)">
        <rect width="180" height="60" rx="5" fill="#e6e6fa" stroke="#000"/>
        <text x="90" y="35" text-anchor="middle">CNN Models</text>
    </g>
    <g transform="translate(520,460)">
        <rect width="180" height="60" rx="5" fill="#e6e6fa" stroke="#000"/>
        <text x="90" y="35" text-anchor="middle">TSMixer Model</text>
    </g>
    
    <!-- Connections -->
    <path d="M400 80 L400 120" stroke="#000" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M400 180 L160 240" stroke="#000" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M400 180 L320 240" stroke="#000" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M400 180 L480 240" stroke="#000" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M400 180 L640 240" stroke="#000" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M160 300 L400 360" stroke="#000" fill="none"/>
    <path d="M320 300 L400 360" stroke="#000" fill="none"/>
    <path d="M480 300 L400 360" stroke="#000" fill="none"/>
    <path d="M640 300 L400 360" stroke="#000" fill="none"/>
    <path d="M400 420 L190 460" stroke="#000" fill="none"/>
    <path d="M400 420 L400 460" stroke="#000" fill="none"/>
    <path d="M400 420 L610 460" stroke="#000" fill="none"/>
    
    <!-- Arrow Marker -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
        </marker>
    </defs>
</svg>
